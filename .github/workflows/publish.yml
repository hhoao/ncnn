name: publish
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# OIDC trusted publishing (pub.dev Admin → Automated publishing, tag
# pattern 'v{{version}}'). The dart-lang reusable workflow handles
# authentication via a GitHub-signed OIDC token — no stored secrets.
# Requires enabling the workflow on pub.dev's package admin page.
# The workflow validates (analyze/test) before publishing.
jobs:
  publish:
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
