name: publish
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Publish
        run: dart pub publish --force
        env:
          # Publishing token created on pub.dev (Manage publishing tokens).
          # See https://dart.dev/tools/pub/automated-publishing — if the
          # env var name differs at execution time, follow those docs.
          # NOTE: PUB_TOKEN semantics must be verified against those docs at
          # the first real release (Task 13 confirms before publishing).
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
